name: App native merge graph probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: streamyfin-spatial-app-graph-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Dry-run baseline and candidate app native producer graph
    if: github.repository == 'kristofferR/streamyfin'
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      CI: 'true'
      EXPO_TV: '0'
      EXPO_NO_TELEMETRY: '1'
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      BASELINE_REF: 77ec6e62f4ec25332ec7ee89802f53a1a22af871
      BASELINE_TREE: e166da9e09a58e4d1494e94ebcac2ad332f3e471
      CANDIDATE_REF: d6275aeab9dbb88146af6af99632f92071a5b971
      CANDIDATE_TREE: 433f86c7dc3ba2158077b084f3fd32d1729045a2
    steps:
      - name: Checkout audited probe branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify workflow-only probe override and same pinned host
        shell: bash
        run: |
          set -euo pipefail
          spatial_ref=5e7c9211b8339ddb2178da6a83124b8a9da68353
          test "$(git rev-parse "$spatial_ref^{tree}")" = 0d394d71a9f008bdff3b0b1451c2135267b00d6c
          git diff --exit-code "$spatial_ref" HEAD -- . ':!.github/workflows/build-apps.yml'
          git merge-base --is-ancestor "$spatial_ref" HEAD
          test "$(git rev-parse "$BASELINE_REF^{tree}")" = "$BASELINE_TREE"
          test "$(git rev-parse "$CANDIDATE_REF^{tree}")" = "$CANDIDATE_TREE"
          git diff --exit-code "$BASELINE_REF" "$CANDIDATE_REF" -- package.json bun.lock plugins/withGradleProperties.ts modules/mpv-player/android/build.gradle

      - name: Install Android verifier utilities
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep ruby unzip coreutils diffutils gawk

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
        with:
          cmdline-tools-version: '15859902' # 22.0
          packages: ''
          log-accepted-android-sdk-licenses: 'false'

      - name: Verify Android SDK root and command-line tools
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="$(realpath "$RUNNER_TEMP/android-sdk")"
          test "$(realpath "$ANDROID_HOME")" = "$sdk_root"
          test "$(realpath "$ANDROID_SDK_ROOT")" = "$sdk_root"
          sdk_manager="$(realpath "$(command -v sdkmanager)")"
          test -x "$sdk_manager"
          case "$sdk_manager" in
            "$sdk_root"/*) ;;
            *) echo 'sdkmanager is outside the configured SDK root'; exit 1 ;;
          esac
          printf 'SDK root: %s\nsdkmanager: %s\n' "$sdk_root" "$sdk_manager"
          "$sdk_manager" --sdk_root="$sdk_root" --version | tee "$RUNNER_TEMP/sdkmanager-version.txt"
          test "$(tr -d '\r' < "$RUNNER_TEMP/sdkmanager-version.txt")" = '22.0'
          printf 'SDKMANAGER_PATH=%s\n' "$sdk_manager" >> "$GITHUB_ENV"

      - name: Install exact Android build tools
        run: '"$SDKMANAGER_PATH" --sdk_root="$ANDROID_SDK_ROOT" "platforms;android-36" "build-tools;35.0.0" "ndk;29.0.14206865" "cmake;4.1.2"'

      - name: Preflight Android verifier and native tools
        shell: bash
        run: |
          set -euo pipefail
          for tool in bash dirname mktemp mkdir rm wc sha256sum cut unzip sort uniq cmp rg awk comm ruby cat git curl jq realpath tr tee head c++ make; do
            command -v "$tool"
          done
          rg --version
          ruby --version
          for tool in java jar javap; do
            test -x "$JAVA_HOME/bin/$tool"
            test "$(realpath "$(command -v "$tool")")" = "$(realpath "$JAVA_HOME/bin/$tool")"
          done
          java -version
          jar --version
          javap -version
          ndk_root="$ANDROID_HOME/ndk/29.0.14206865"
          test "$(awk -F ' *= *' '$1 == "Pkg.Revision" {print $2}' "$ndk_root/source.properties")" = '29.0.14206865'
          readelf="$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -x "$readelf"
          "$readelf" --version
          cmake_bin="$ANDROID_HOME/cmake/4.1.2/bin"
          for tool in cmake ctest ninja; do
            test -x "$cmake_bin/$tool"
            "$cmake_bin/$tool" --version
          done
          test "$("$cmake_bin/cmake" --version | head -n 1)" = 'cmake version 4.1.2'
          # Expose only the pinned SDK CMake for tool inventory; no configure/build is run.
          printf '%s\n' "$cmake_bin" >> "$GITHUB_PATH"

      - name: Write read-only configuration and graph helpers
        id: probe_setup
        shell: bash
        run: |
          set -euo pipefail
          command -v timeout
          command -v jq
          command -v tail
          mkdir -p "$RUNNER_TEMP/app-graph-diagnostics"
          cat > "$RUNNER_TEMP/probe-app-graph.init.gradle" <<'GROOVY'
          import groovy.json.JsonOutput

          // Read-only configuration/producer inventory. Never change the graph or task predicates.
          def output = new File(System.getenv('PROBE_OUTPUT'))
          def label = System.getenv('PROBE_LABEL')
          if (!(label in ['baseline', 'candidate'])) throw new GradleException('Unknown probe label')
          def writeBounded = { String suffix, String text, int limit ->
              if (text.getBytes('UTF-8').length > limit) throw new GradleException("Probe ${suffix} exceeds text limit")
              new File(output, "${label}-${suffix}").setText(text, 'UTF-8')
          }
          def selectedVariants = []
          gradle.beforeProject { p ->
              if (p.path == ':app') p.pluginManager.withPlugin('com.android.application') {
                  def components = p.extensions.getByName('androidComponents')
                  components.onVariants(components.selector().withBuildType('debug')) { variant ->
                      selectedVariants.add(variant)
                  }
              }
          }
          gradle.projectsEvaluated {
              def app = gradle.rootProject.findProject(':app')
              if (app == null) return // Included build plugins may configure their own builds.
              if (!gradle.startParameter.dryRun || gradle.startParameter.taskNames != [':app:mergeDebugNativeLibs']) {
                  throw new GradleException('Probe requires exactly :app:mergeDebugNativeLibs --dry-run')
              }
              if (app.findProperty('android.builder.sdkDownload')?.toString() != 'false') {
                  throw new GradleException('Probe must disable automatic SDK downloads')
              }
              def info = [source: System.getenv('PROBE_SOURCE'), tree: System.getenv('PROBE_TREE'),
                          gradle: gradle.gradleVersion, mainTaskExecution: 'dry-run', sdkAutoDownload: false]
              try {
                  def loader = app.plugins.getPlugin('com.android.application').class.classLoader
                  info.agp = loader.loadClass('com.android.Version').getField('ANDROID_GRADLE_PLUGIN_VERSION').get(null)
                  if (info.agp != '8.12.0') throw new GradleException("Unexpected AGP ${info.agp}; probe API audit is for 8.12.0")
                  def android = app.extensions.getByName('android')
                  if (android.ndkVersion != '29.0.14206865') throw new GradleException('Unexpected app NDK request')
                  def sdkComponents = app.extensions.getByName('androidComponents').sdkComponents
                  def sdk = sdkComponents.sdkDirectory.get().asFile.canonicalFile
                  def ndk = sdkComponents.ndkDirectory.get().asFile.canonicalFile
                  if (sdk != new File(System.getenv('ANDROID_HOME')).canonicalFile ||
                          ndk != new File(sdk, 'ndk/29.0.14206865').canonicalFile) {
                      throw new GradleException('App resolved SDK/NDK outside pinned roots')
                  }
                  def ndkProperties = new Properties()
                  new File(ndk, 'source.properties').withInputStream { ndkProperties.load(it) }
                  info.sdkRoot = sdk.path
                  info.ndk = [requested: android.ndkVersion, root: ndk.path, resolved: ndkProperties.getProperty('Pkg.Revision')]
                  if (info.ndk.resolved != '29.0.14206865') throw new GradleException('Resolved NDK version mismatch')
                  info.appAbis = android.defaultConfig.ndk.abiFilters.toList().sort()
                  info.cmakeFile = android.externalNativeBuild.cmake.path?.canonicalPath
                  info.cmakeArguments = android.defaultConfig.externalNativeBuild.cmake.arguments.findAll {
                      it.startsWith('-DANDROID_STL=') || it.startsWith('-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=')
                  }.collect { it.toString() }
                  def requestedCmake = android.externalNativeBuild.cmake.version
                  def requirements = loader.loadClass('com.android.build.gradle.internal.cxx.configure.CmakeVersionRequirements')
                          .getConstructor(String).newInstance([requestedCmake] as Object[])
                  def effectiveCmake = requirements.effectiveRequestVersion.toString()
                  def cmakeRoot = new File(sdk, 'cmake')
                  def installed = (cmakeRoot.listFiles() ?: []).findAll { it.isDirectory() }.sort { it.name }.collect { directory ->
                      def properties = new Properties()
                      def file = new File(directory, 'source.properties')
                      if (file.isFile()) file.withInputStream { properties.load(it) }
                      [folder: directory.name, revision: properties.getProperty('Pkg.Revision'),
                       executable: new File(directory, 'bin/cmake').isFile()]
                  }
                  if (installed.size() > 10) throw new GradleException('Unexpected CMake inventory size')
                  def matching = installed.findAll { it.revision == effectiveCmake && it.executable }
                  info.cmake = [dslRequested: requestedCmake, effectiveRequiredByAgp: effectiveCmake, installed: installed,
                                matchingInstalled: matching, agpResolvedExecutable: null,
                                resolution: matching ? 'PRESENT_BUT_RESOLUTION_DEFERRED_TO_CONFIGURE_TASK' : 'MISSING_EFFECTIVE_VERSION_NO_INSTALL',
                                note: 'Dry-run does not execute CMake discovery/configure; no tool is guessed or installed']
                  if (selectedVariants.size() != 1) throw new GradleException('Expected exactly one debug app variant')
                  def packaging = selectedVariants[0].packaging.jniLibs
                  info.nativePackaging = [pickFirsts: packaging.pickFirsts.get().toList().sort(),
                                          excludes: packaging.excludes.get().toList().sort(),
                                          keepDebugSymbols: packaging.keepDebugSymbols.get().toList().sort()]
              } finally {
                  writeBounded('config.json', JsonOutput.prettyPrint(JsonOutput.toJson(info)) + '\n', 65536)
              }
          }
          gradle.taskGraph.whenReady { graph ->
              if (!graph.allTasks.any { it.path == ':app:mergeDebugNativeLibs' }) return
              if (!gradle.startParameter.dryRun) throw new GradleException('Refusing task execution')
              def tasks = graph.allTasks
              if (tasks.size() > 2000) throw new GradleException('Probe graph exceeds task limit')
              def rows = ['order\ttask\ttype\tdirect_dependencies\tfinalizers']
              tasks.eachWithIndex { task, index ->
                  rows.add([index, task.path, task.class.name,
                            task.taskDependencies.getDependencies(task).collect { it.path }.sort().join(','),
                            task.finalizedBy.getDependencies(task).collect { it.path }.sort().join(',')].join('\t'))
              }
              writeBounded('tasks.tsv', rows.join('\n') + '\n', 524288)
              def forbidden = tasks.findAll { task ->
                  task.name ==~ /(?i).*(upload|publish|install|validateSigning|sign.*Apk).*/ ||
                      (task.project.path == ':app' && task.name ==~ /(?i)(assemble.*|bundle.*|packageDebug|packageRelease|sign.*)/)
              }.collect { it.path }
              if (forbidden) throw new GradleException("Unexpected non-merge producers/finalizers: ${forbidden.join(', ')}")
          }
          GROOVY
          cat > "$RUNNER_TEMP/probe-app-graph.sh" <<'SH'
          #!/bin/bash
          set -euo pipefail
          label="${1:?baseline or candidate}"
          source_ref="${2:?exact ref}"
          source_tree="${3:?exact tree}"
          case "$label" in baseline|candidate) ;; *) exit 1 ;; esac
          test "$(git rev-parse HEAD)" = "$source_ref"
          test "$(git rev-parse HEAD^{tree})" = "$source_tree"
          diagnostics="$RUNNER_TEMP/app-graph-diagnostics"
          mkdir -p "$diagnostics"
          raw="$RUNNER_TEMP/$label-graph-raw.log"
          started="$(date +%s)"
          finish() {
              result=$?
              trap - EXIT
              if [ -f "$raw" ]; then tail -c 131072 "$raw" > "$diagnostics/$label-dry-run.log"; fi
              jq -n --arg source "$source_ref" --arg tree "$source_tree" --argjson exit_code "$result" \
                  --argjson elapsed_seconds "$(( $(date +%s) - started ))" \
                  --arg lock_sha256 "$(sha256sum bun.lock | cut -d ' ' -f 1)" \
                  --arg package_sha256 "$(sha256sum package.json | cut -d ' ' -f 1)" \
                  '{source:$source,tree:$tree,exit_code:$exit_code,elapsed_seconds:$elapsed_seconds,lock_sha256:$lock_sha256,package_sha256:$package_sha256,main_task_execution:"dry-run",included_build_plugin_compilation_may_occur:true}' \
                  > "$diagnostics/$label-status.json"
              exit "$result"
          }
          trap finish EXIT
          timeout --signal=TERM --kill-after=30s 180s bun install --frozen-lockfile
          timeout --signal=TERM --kill-after=30s 120s bun run expo prebuild --platform android --clean --no-install
          git diff --exit-code -- bun.lock package.json
          if [ "$label" = candidate ]; then
              (cd modules/mpv-player/android/libmpv-binding && sha256sum -c consumer/source-inputs.sha256)
          fi
          export PROBE_OUTPUT="$diagnostics" PROBE_LABEL="$label" PROBE_SOURCE="$source_ref" PROBE_TREE="$source_tree"
          (
              cd android
              timeout --signal=TERM --kill-after=30s 480s ./gradlew --no-daemon --no-configuration-cache --no-build-cache \
                  --console=plain -Pandroid.builder.sdkDownload=false \
                  --init-script "$RUNNER_TEMP/probe-app-graph.init.gradle" :app:mergeDebugNativeLibs --dry-run
          ) 2>&1 | tee "$raw"
          git diff --exit-code -- bun.lock package.json
          SH

      - name: Checkout exact published-dependency baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.BASELINE_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Probe exact baseline without task execution
        shell: bash
        run: bash "$RUNNER_TEMP/probe-app-graph.sh" baseline "$BASELINE_REF" "$BASELINE_TREE"

      - name: Remove baseline generated project and dependencies
        id: baseline_cleanup
        if: ${{ always() && steps.probe_setup.outcome == 'success' }}
        shell: bash
        run: rm -rf node_modules android modules/mpv-player/android/build modules/mpv-player/android/libmpv-binding/consumer/build modules/mpv-player/android/libmpv-binding/consumer/.cxx

      - name: Checkout exact imported-runtime candidate
        if: ${{ !cancelled() && steps.probe_setup.outcome == 'success' && steps.baseline_cleanup.outcome == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Probe exact candidate without task execution
        if: ${{ !cancelled() && steps.probe_setup.outcome == 'success' && steps.baseline_cleanup.outcome == 'success' }}
        shell: bash
        run: bash "$RUNNER_TEMP/probe-app-graph.sh" candidate "$CANDIDATE_REF" "$CANDIDATE_TREE"

      - name: Enforce the eight named text artifact limits
        id: text_bounds
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          diagnostics="$RUNNER_TEMP/app-graph-diagnostics"
          for label in baseline candidate; do
            for spec in config.json:65536 tasks.tsv:524288 dry-run.log:131072 status.json:4096; do
              file="$diagnostics/$label-${spec%:*}"
              if [ -f "$file" ]; then test "$(wc -c < "$file")" -le "${spec#*:}"; fi
            done
          done

      - name: Retain configuration and graph text for one day
        if: ${{ always() && steps.text_bounds.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-native-graph-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/app-graph-diagnostics/baseline-config.json
            ${{ runner.temp }}/app-graph-diagnostics/baseline-tasks.tsv
            ${{ runner.temp }}/app-graph-diagnostics/baseline-dry-run.log
            ${{ runner.temp }}/app-graph-diagnostics/baseline-status.json
            ${{ runner.temp }}/app-graph-diagnostics/candidate-config.json
            ${{ runner.temp }}/app-graph-diagnostics/candidate-tasks.tsv
            ${{ runner.temp }}/app-graph-diagnostics/candidate-dry-run.log
            ${{ runner.temp }}/app-graph-diagnostics/candidate-status.json
          retention-days: 1
          if-no-files-found: warn

      - name: Remove final generated project and dependencies
        if: always()
        shell: bash
        run: rm -rf node_modules android modules/mpv-player/android/build modules/mpv-player/android/libmpv-binding/consumer/build modules/mpv-player/android/libmpv-binding/consumer/.cxx
