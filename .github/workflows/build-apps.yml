name: Spatial audio validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: streamyfin-spatial-validation
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'kristofferR/streamyfin'
    runs-on: macos-26
    timeout-minutes: 150
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      SPATIAL_REF: 5380719d87f2b3fe4ef434e5b5c9d417fcab8a48
      PROGRESS_REF: 56c39e439a4529de13a38434bb76fd149ce34f14
    steps:
      - name: Checkout audited validation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify candidate differs only by this workflow
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$SPATIAL_REF" HEAD -- . ':!.github/workflows/build-apps.yml'
          test "$(git rev-parse HEAD^)" = "$SPATIAL_REF"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: '26.6'

      - name: Native track-selection regression
        shell: bash
        run: |
          set -euo pipefail
          bash modules/mpv-player/tests/native-audio-track-selection.sh
          source_path=modules/mpv-player/ios/MPVLayerRenderer.swift
          trap 'git show "$SPATIAL_REF:$source_path" > "$source_path"' EXIT
          git show "$SPATIAL_REF^:$source_path" > "$source_path"
          if bash modules/mpv-player/tests/native-audio-track-selection.sh; then
            echo 'Regression test unexpectedly passed before the fix'
            exit 1
          fi

      - name: Checkout progress candidate for focused tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.PROGRESS_REF }}
          path: progress-candidate
          fetch-depth: 2
          persist-credentials: false

      - name: Progress candidate quality and event-order tests
        working-directory: progress-candidate
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun run check
          bun run test:unit --runInBand utils/nativePlayer/applyLoadEvent.test.ts utils/nativePlayer/applyProgressTick.test.ts utils/nativePlayer/syncPlay.test.ts utils/nativePlayer/resolveTeardownReport.test.ts
          source_path=utils/nativePlayer/applyLoadEvent.ts
          trap 'git show "$PROGRESS_REF:$source_path" > "$source_path"' EXIT
          git show "$PROGRESS_REF^:$source_path" > "$source_path"
          if bun run test:unit --runInBand utils/nativePlayer/applyLoadEvent.test.ts; then
            echo 'Regression test unexpectedly passed before the fix'
            exit 1
          fi

      - name: Remove progress checkout
        if: always()
        run: rm -rf progress-candidate

      - name: Spatial candidate quality and track-mapping tests
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun run check
          bun run test:unit --runInBand utils/jellyfin/subtitleUtils.test.ts utils/nativePlayer/resolveTrackIndexes.test.ts
          git diff --exit-code -- bun.lock package.json

      - name: Generate iOS project and freeze resolved pods
        env:
          EXPO_TV: '0'
        shell: bash
        run: |
          set -euo pipefail
          bunx --no-install expo prebuild --clean --no-install
          cd ios
          pod install
          pod install --deployment

      - name: Archive iOS unsigned
        env:
          EXPO_TV: '0'
        run: bun run ios:unsigned-build --no-install --skip-credentials --verbose

      - name: Remove iOS build output before tvOS
        run: rm -rf ios build "$HOME/Library/Developer/Xcode/DerivedData"

      - name: Generate tvOS project and freeze resolved pods
        env:
          EXPO_TV: '1'
        shell: bash
        run: |
          set -euo pipefail
          bunx --no-install expo prebuild --clean --no-install
          cd ios
          pod install
          pod install --deployment

      - name: Archive tvOS unsigned
        env:
          EXPO_TV: '1'
        run: bun run ios:unsigned-build:tv --no-install --skip-credentials --verbose

      - name: Remove all build output
        if: always()
        run: rm -rf ios build "$HOME/Library/Developer/Xcode/DerivedData"
