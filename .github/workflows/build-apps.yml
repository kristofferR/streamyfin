# Fork-only validation for the SpatialAudioBridge branches. It replaces the
# app build on this ci/ branch only, so it runs from workflow_dispatch with the
# branch to check, and never publishes anything.
name: SpatialAudioBridge validation

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to validate
        required: true
        default: sab-2.0
      apple:
        description: Archive unsigned iOS and tvOS apps
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  quality:
    if: github.repository == 'kristofferR/streamyfin'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run check
      - run: bun run test:unit

  apple:
    if: github.repository == 'kristofferR/streamyfin' && inputs.apple
    runs-on: macos-26
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, tvos]
    env:
      EXPO_TV: ${{ matrix.platform == 'tvos' && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.6"
      - run: bun install --frozen-lockfile
      - run: bun run ${{ matrix.platform == 'tvos' && 'prebuild:tv' || 'prebuild' }}
      - name: Show the resolved SpatialAudioBridge
        run: |
          grep -A3 'SpatialAudioBridge' ios/Pods/Pods.xcodeproj/project.pbxproj | grep -E 'repositoryURL|kind|version' | sort -u
      - run: bun run ${{ matrix.platform == 'tvos' && 'ios:unsigned-build:tv' || 'ios:unsigned-build' }}
      # SpatialAudioBridge 2's core is a dynamic framework: without it in the
      # bundle the app fails to launch, which a build alone never shows.
      - name: Check the app embeds and links SpatialAudioCore
        run: |
          set -euo pipefail
          ipa=$(ls build/*.ipa | head -n 1)
          mkdir -p "$RUNNER_TEMP/ipa"
          unzip -q "$ipa" -d "$RUNNER_TEMP/ipa"
          app=$(ls -d "$RUNNER_TEMP"/ipa/Payload/*.app | head -n 1)
          ls "$app/Frameworks"
          core="$app/Frameworks/SpatialAudioCore.framework/SpatialAudioCore"
          test -f "$core"
          file "$core"
          binary="$app/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          otool -L "$binary" | grep -F '@rpath/SpatialAudioCore.framework/SpatialAudioCore'
          otool -l "$binary" | grep -A2 LC_RPATH | grep -F '@executable_path/Frameworks'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: streamyfin-${{ matrix.platform }}-unsigned
          path: build/*.ipa
          retention-days: 3
